[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fuzzyfold"
dynamic = ["version"]
description = "fuzzyfold Python bindings"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[tool.maturin]
python-source = "python"
module-name = "fuzzyfold._fuzzyfold"
features = ["pyo3/extension-module"]
