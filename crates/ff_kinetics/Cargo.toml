[package]
name = "ff_kinetics"
version = "0.6.0"
description = "fuzzyfold's stochastic secondary structure simulations."
documentation = "https://docs.rs/ff_kinetics"
keywords = ["dna", "rna", "secondary-structure", "kinetics", "nearest-neighbor"]
readme = "README.md"

edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true

[dependencies]
ff_structure.workspace = true
ff_energy.workspace = true

log.workspace = true
plotters.workspace = true
rand.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "explore"
harness = false

[[bench]]
name = "stochastic_simulation"
harness = false

[[bench]]
name = "macrostates"
harness = false

[features]
shift_analysis = []

# A workload for instruction counts (callgrind), built as an example for a
# fixed path: target/release/examples/kinetics_workload
[[example]]
name = "kinetics_workload"
path = "benches/workloads/kinetics_workload.rs"
