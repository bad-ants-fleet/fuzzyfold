[package]
name = "fuzzyfold"
version = "0.4.1"
description = "Nucleic acid secondary structure kinetics."
documentation = "https://docs.rs/fuzzyfold"
keywords = ["dna", "rna", "secondary-structure", "kinetics", "nearest-neighbor"]
readme = "../../README.md"

edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true

autobins = false

[[bin]]
name = "ff-arc-diagram"
path = "src/bin/ff-arc-diagram.rs"

[[bin]]
name = "ff-loops"
path = "src/bin/ff-loops.rs"

[[bin]]
name = "ff-density"
path = "src/bin/ff-density.rs"

[[bin]]
name = "ff-calc-pseudo"
path = "src/bin/ff-calc-pseudo.rs"

[[bin]]
name = "ff-randseq"
path = "src/bin/ff-randseq.rs"

[[bin]]
name = "ff-eval"
path = "src/bin/ff-eval.rs"

[[bin]]
name = "ff-explore"
path = "src/bin/ff-explore.rs"

[[bin]]
name = "ff-timecourse"
path = "src/bin/ff-timecourse.rs"

[[bin]]
name = "ff-trajectory"
path = "src/bin/ff-trajectory.rs"

[dependencies]
ff_structure.workspace = true
ff_energy.workspace = true
ff_kinetics.workspace = true

colored.workspace = true
env_logger.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
indicatif = "0.18.3"
paste = "1.0.15"
rayon = "1.11.0"
resvg = "0.48"

[badges]
maintenance = { status = "actively-developed" }

