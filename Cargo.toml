[workspace]
members = ["crates/ff_structure",
           "crates/ff_energy", 
           "crates/ff_kinetics",
           "crates/ff_python",
           "crates/fuzzyfold"]
default-members = ["crates/fuzzyfold"]
resolver = "3"

[workspace.package]

edition = "2024"
license = "MIT"
repository = "https://github.com/bad-ants-fleet/fuzzyfold"
categories = [
    "science",
    "science::bioinformatics",
    "science::bioinformatics::genomics",
    "science::bioinformatics::sequence-analysis",
]

[workspace.dependencies]
# local crates
ff_energy    = { path = "./crates/ff_energy", version = "0.5.0" }
ff_structure = { path = "./crates/ff_structure", version = "0.4.0" }
ff_kinetics  = { path = "./crates/ff_kinetics", version = "0.5.0" }

# shared crates
colored = "3.1.1"
criterion = "0.7.0"
env_logger = "0.11.8"
itertools = "0.14.0"
log = "0.4.29"
ndarray = { version = "0.16.1", features = ["serde"] }
nohash-hasher = "0.2.0"
plotters = "0.3.7"
rand = "0.9.2"
rustc-hash = "2.1.1"
serde = "1.0.228"
serde_json = "1.0.149"

