[workspace]
members = ["crates/ff_structure",
           "crates/ff_energy", 
           "crates/ff_kinetics",
           "crates/ff_python",
           "crates/fuzzyfold"]
default-members = ["crates/fuzzyfold"]
resolver = "3"

[workspace.package]

edition = "2024"
license = "MIT"
repository = "https://github.com/bad-ants-fleet/fuzzyfold"
categories = [
    "science",
    "science::bioinformatics",
    "science::bioinformatics::genomics",
    "science::bioinformatics::sequence-analysis",
]

[profile.bench]
debug = true   # keep symbols for samply/flamegraph profiling

[workspace.dependencies]
# local crates
ff_energy    = { path = "./crates/ff_energy", version = "0.6.0" }
ff_structure = { path = "./crates/ff_structure", version = "0.6.0" }
ff_kinetics  = { path = "./crates/ff_kinetics", version = "0.6.0" }

# shared crates
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
criterion = "0.8.2"
env_logger = "0.11.11"
indicatif = "0.18.6"
libc = "0.2.191"
log = "0.4.34"
pastey = "0.2.3"
plotters = "0.3.7"
rand = "0.10.3"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = "1.0.229"
serde_json = "1.0.151"

